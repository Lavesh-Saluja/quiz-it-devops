name: CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: us-central1
  MIG_NAME: quizit-web-mig
  DOCKER_IMAGE: laveshsaluja32/quizit

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}

  create-instance-template:
    name: Create GCP Instance Template
    runs-on: ubuntu-latest
    needs: build-and-push

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Prepare startup script
        env:
          IMAGE: ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
        run: |
          test -n "${IMAGE}"

          echo "IMAGE=${IMAGE}"

          sed "s|__IMAGE__|${IMAGE}|g" deploy/startup.sh > /tmp/quizit-startup.sh

          echo "===== Generated image reference ====="
          grep '^IMAGE=' /tmp/quizit-startup.sh

          grep -q "^IMAGE=\"${IMAGE}\"$" /tmp/quizit-startup.sh

      - name: Create regional instance template
        env:
          TEMPLATE_NAME: quizit-web-template-${{ github.sha }}
        run: |
          gcloud compute instance-templates create "${TEMPLATE_NAME}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --instance-template-region="${GCP_REGION}" \
            --machine-type=e2-small \
            --network=default \
            --subnet=default \
            --tags=quizit-web \
            --service-account="${{ vars.GCP_VM_SERVICE_ACCOUNT }}" \
            --scopes=cloud-platform \
            --image-family=debian-13 \
            --image-project=debian-cloud \
            --boot-disk-size=20GB \
            --boot-disk-type=pd-balanced \
            --metadata-from-file=startup-script=/tmp/quizit-startup.sh

      - name: Describe created template
        env:
          TEMPLATE_NAME: quizit-web-template-${{ github.sha }}
        run: |
          gcloud compute instance-templates describe "${TEMPLATE_NAME}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --format="yaml(
              name,
              creationTimestamp,
              properties.machineType,
              properties.disks,
              properties.networkInterfaces,
              properties.tags,
              properties.serviceAccounts,
              properties.metadata
            )"

  update-mig:
    name: Update Managed Instance Group
    runs-on: ubuntu-latest
    needs: create-instance-template

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Update MIG instance template
        env:
          TEMPLATE_NAME: quizit-web-template-${{ github.sha }}
        run: |
          echo "===== Updating MIG ====="
          echo "MIG: ${MIG_NAME}"
          echo "Template: ${TEMPLATE_NAME}"

          gcloud compute instance-groups managed set-instance-template "${MIG_NAME}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --template="${TEMPLATE_NAME}"

      - name: Wait for target template
        run: |
          echo "===== Waiting for target template ====="

          timeout 20m \
            gcloud compute instance-groups managed wait-until "${MIG_NAME}" \
              --project="${GCP_PROJECT_ID}" \
              --region="${GCP_REGION}" \
              --version-target-reached

      - name: Wait for MIG stability
        run: |
          echo "===== Waiting for MIG stability ====="

          timeout 20m \
            gcloud compute instance-groups managed wait-until "${MIG_NAME}" \
              --project="${GCP_PROJECT_ID}" \
              --region="${GCP_REGION}" \
              --stable

      - name: Verify deployment
        run: |
          echo "===== Final MIG state ====="

          gcloud compute instance-groups managed describe "${MIG_NAME}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --format="yaml(
              targetSize,
              instanceTemplate,
              versions,
              updatePolicy,
              status
            )"

          echo
          echo "===== Managed instances ====="

          gcloud compute instance-groups managed list-instances "${MIG_NAME}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}"